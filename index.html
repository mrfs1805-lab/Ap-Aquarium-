<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Details</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1c2333; --muted:#6b7385; --brand:#2563eb; --ok:#16a34a; --err:#dc2626; --line:#dde2ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Noto Sans Tamil",sans-serif; background:var(--bg); color:var(--ink); padding:16px; }
  .card { max-width:480px; margin:0 auto; background:var(--card); border-radius:16px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,.07); }
  h1 { font-size:20px; margin:0 0 16px; }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  input, textarea { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; font-family:inherit; }
  input:focus, textarea:focus { outline:2px solid var(--brand); border-color:transparent; }
  textarea { min-height:80px; resize:vertical; }
  .loc { margin-top:14px; padding:12px; border:1px dashed var(--line); border-radius:10px; background:#fafbfe; }
  .loc .status { font-size:14px; color:var(--muted); }
  .loc.ok { border-color:var(--ok); background:#f0fdf4; }
  .loc.ok .status { color:var(--ok); font-weight:600; }
  .loc.bad { border-color:var(--err); background:#fef2f2; }
  .loc.bad .status { color:var(--err); }
  button { width:100%; padding:13px; font-size:16px; font-weight:600; border:0; border-radius:10px; cursor:pointer; margin-top:10px; }
  .btn-loc { background:#e8eefc; color:var(--brand); }
  .btn-submit { background:var(--brand); color:#fff; margin-top:18px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:14px; font-size:14px; text-align:center; min-height:20px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .hidden { display:none; }

  /* language selection screen */
  .lang-title { text-align:center; margin:8px 0 4px; }
  .lang-sub { text-align:center; color:var(--muted); font-size:14px; margin:0 0 18px; }
  .btn-lang { background:var(--brand); color:#fff; font-size:18px; padding:16px; }
  .btn-lang.alt { background:#e8eefc; color:var(--brand); }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .topbar h1 { margin:0; }
  .switch { width:auto; margin:0; padding:6px 10px; font-size:13px; background:#e8eefc; color:var(--brand); }
</style>
</head>
<body>
<div class="card">

  <!-- மொழித் தேர்வு / Language selection -->
  <div id="langScreen">
    <h1 class="lang-title">🌐 மொழியைத் தேர்ந்தெடுக்கவும்</h1>
    <p class="lang-sub">Select your language</p>
    <button type="button" class="btn-lang" id="langTa">தமிழ்</button>
    <button type="button" class="btn-lang alt" id="langEn">English</button>
  </div>

  <!-- படிவம் / Form -->
  <div id="formScreen" class="hidden">
    <div class="topbar">
      <h1 id="tTitle"></h1>
      <button type="button" class="switch" id="switchBtn"></button>
    </div>
    <form id="f" autocomplete="on" novalidate>
      <label for="name" id="tName"></label>
      <input id="name" name="name" type="text" required autocomplete="name">

      <label for="address" id="tAddress"></label>
      <textarea id="address" name="address" required autocomplete="street-address"></textarea>

      <label for="phone" id="tPhone"></label>
      <input id="phone" name="phone" type="tel" inputmode="tel" required autocomplete="tel" placeholder="07XXXXXXXX">

      <label id="tLocation"></label>
      <div class="loc" id="loc">
        <div class="status" id="locStatus"></div>
        <button type="button" class="btn-loc" id="locBtn"></button>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn" disabled></button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script>
// ▼▼ உங்கள் Apps Script Web App URL ஐ இங்கே ஒட்டவும் / Paste your Apps Script Web App URL here ▼▼
const API_URL = 'https://script.google.com/macros/s/AKfycbyCgWS3aFHpQzpqhoMk4tb_X6obub4GijSxrz9hfjlEdOa0btXwZyGvl0V-LGsJIJd0/exec';

const I18N = {
  ta: {
    pageTitle: 'வாடிக்கையாளர் விவரம்',
    title: '📋 வாடிக்கையாளர் விவரம்',
    switchLang: '🌐 English',
    name: 'பெயர் (Name)',
    address: 'முகவரி (Address)',
    phone: 'தொலைபேசி எண் (Phone)',
    location: 'இடம் (Location)',
    submit: 'சமர்ப்பி (Submit)',
    sending: 'அனுப்பப்படுகிறது…',
    locBtnGet: '📍 என் இடத்தைப் பெறு',
    locBtnAgain: '🔄 மீண்டும் எடு',
    locBtnRetry: '📍 மீண்டும் முயற்சி',
    locHint: 'கீழுள்ள "📍 என் இடத்தைப் பெறு" பொத்தானை அழுத்தி, வரும் கேள்விக்கு Allow தேர்ந்தெடுக்கவும்',
    locFetching: 'இடம் எடுக்கப்படுகிறது… அனுமதி கேட்டால் "Allow" அழுத்தவும்',
    locOk: (acc) => `✔ இடம் எடுக்கப்பட்டது (±${acc} மீ)`,
    locNone: 'இடம் இன்னும் எடுக்கப்படவில்லை',
    errDenied: 'அனுமதி மறுக்கப்பட்டது. முகவரிப் பட்டியில் 🔒 அடையாளத்தை அழுத்தி Location → Allow செய்து, பக்கத்தை Reload செய்யவும். (போனில்: Settings → Location ஆன் இருக்க வேண்டும்)',
    errUnavailable: 'இடம் கிடைக்கவில்லை. போனின் GPS / Location ஐ ஆன் செய்து மீண்டும் முயற்சிக்கவும்',
    errTimeout: 'நேரம் முடிந்தது. வெளியே / திறந்த இடத்தில் மீண்டும் முயற்சிக்கவும்',
    errNoApi: 'இந்த உலாவியில் இடம் எடுக்க முடியாது. Chrome / Safari இல் திறக்கவும்',
    errInsecure: 'இந்தப் பக்கம் பாதுகாப்பற்ற முறையில் திறக்கப்பட்டுள்ளது. https:// இணைப்பாக (எ.கா. GitHub Pages / Netlify) Chrome அல்லது Safari இல் திறக்கவும். கோப்பாக / WhatsApp / preview இல் திறந்தால் Location வேலை செய்யாது.',
    fillAll: 'அனைத்து புலங்களையும் நிரப்பவும்',
    badPhone: 'சரியான தொலைபேசி எண்ணை உள்ளிடவும்',
    needLoc: 'முதலில் இடத்தைப் பெறவும்',
    noApiUrl: 'API_URL அமைக்கப்படவில்லை',
    saved: '✔ வெற்றிகரமாக சேமிக்கப்பட்டது',
    saveFail: 'சேமிக்க முடியவில்லை: '
  },
  en: {
    pageTitle: 'Customer Details',
    title: '📋 Customer Details',
    switchLang: '🌐 தமிழ்',
    name: 'Name',
    address: 'Address',
    phone: 'Phone number',
    location: 'Location',
    submit: 'Submit',
    sending: 'Sending…',
    locBtnGet: '📍 Get my location',
    locBtnAgain: '🔄 Get again',
    locBtnRetry: '📍 Try again',
    locHint: 'Tap the "📍 Get my location" button below, then choose Allow when asked',
    locFetching: 'Getting your location… tap "Allow" if asked',
    locOk: (acc) => `✔ Location captured (±${acc} m)`,
    locNone: 'Location not captured yet',
    errDenied: 'Permission denied. Tap the 🔒 icon in the address bar, set Location → Allow, then reload the page. (On your phone, Location must be turned on in Settings)',
    errUnavailable: "Couldn't get your location. Turn on your phone's GPS / Location and try again",
    errTimeout: 'Timed out. Try again outdoors or in an open area',
    errNoApi: "This browser can't get your location. Open the page in Chrome or Safari",
    errInsecure: "This page was opened in an insecure way. Open it as an https:// link (e.g. GitHub Pages / Netlify) in Chrome or Safari. Location won't work from a local file, WhatsApp or a preview.",
    fillAll: 'Please fill in all fields',
    badPhone: 'Enter a valid phone number',
    needLoc: 'Please capture your location first',
    noApiUrl: 'API_URL is not set',
    saved: '✔ Saved successfully',
    saveFail: 'Could not save: '
  }
};

const $ = id => document.getElementById(id);
let lang = null;                 // 'ta' | 'en'
let pos = null;                  // {lat, lng, accuracy}
let locState = { cls: '', key: 'locNone', arg: null };   // கடைசி இடநிலை (மொழி மாறும்போது மீண்டும் வரைய)
let locBtnKey = 'locBtnGet';
let msgState = null;             // { cls, key, extra }

const t = (key, arg) => {
  const v = I18N[lang][key];
  return typeof v === 'function' ? v(arg) : v;
};

function renderLoc() {
  $('loc').className = 'loc ' + locState.cls;
  $('locStatus').textContent = t(locState.key, locState.arg);
  $('locBtn').textContent = t(locBtnKey);
}
function setLoc(cls, key, arg) { locState = { cls, key, arg }; renderLoc(); }

function renderMsg() {
  const m = $('msg');
  if (!msgState) { m.className = 'msg'; m.textContent = ''; return; }
  m.className = 'msg ' + msgState.cls;
  m.textContent = t(msgState.key) + (msgState.extra || '');
}
function setMsg(cls, key, extra) { msgState = { cls, key, extra }; renderMsg(); }

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('pageTitle');
  $('tTitle').textContent = t('title');
  $('switchBtn').textContent = t('switchLang');
  $('tName').textContent = t('name');
  $('tAddress').textContent = t('address');
  $('tPhone').textContent = t('phone');
  $('tLocation').textContent = t('location');
  if (!$('submitBtn').dataset.busy) $('submitBtn').textContent = t('submit');
  renderLoc();
  renderMsg();
}

function showForm(l) {
  lang = l;
  $('langScreen').classList.add('hidden');
  $('formScreen').classList.remove('hidden');
  applyLang();
  if (!pos && locState.key === 'locNone') initLocation();
}

function showLangScreen() {
  $('formScreen').classList.add('hidden');
  $('langScreen').classList.remove('hidden');
}

/* ---------- Location ---------- */
function errKey(err) {
  return err.code === 1 ? 'errDenied' : err.code === 2 ? 'errUnavailable' : 'errTimeout';
}

function onGot(p) {
  pos = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: Math.round(p.coords.accuracy) };
  locBtnKey = 'locBtnAgain';
  $('locBtn').disabled = false;
  setLoc('ok', 'locOk', pos.accuracy);
  updateSubmit();
}

function onFail(err) {
  pos = null;
  locBtnKey = 'locBtnRetry';
  $('locBtn').disabled = false;
  setLoc('bad', errKey(err));
  updateSubmit();
}

function getLocation() {
  pos = null; updateSubmit();
  if (!navigator.geolocation) { setLoc('bad', 'errNoApi'); return; }
  if (window.isSecureContext === false) { setLoc('bad', 'errInsecure'); return; }
  setLoc('', 'locFetching');
  $('locBtn').disabled = true;
  // முதலில் துல்லியமாக; தோல்வியடைந்தால் (அனுமதி மறுப்பு தவிர) சாதாரண முறையில் மீண்டும்
  navigator.geolocation.getCurrentPosition(onGot, err => {
    if (err.code === 1) return onFail(err);
    navigator.geolocation.getCurrentPosition(onGot, onFail, { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
}

// படிவம் திறந்ததும்: ஏற்கனவே அனுமதி இருந்தால் தானாக எடுக்கும்; இல்லையெனில் பொத்தானை அழுத்த வேண்டும்
async function initLocation() {
  locBtnKey = 'locBtnGet';
  if (window.isSecureContext === false) { getLocation(); return; }
  try {
    const st = await navigator.permissions.query({ name: 'geolocation' });
    if (st.state === 'granted') { getLocation(); return; }
    if (st.state === 'denied') { setLoc('bad', 'errDenied'); return; }
  } catch (e) {}
  setLoc('', 'locHint');
}

function updateSubmit() { $('submitBtn').disabled = !pos; }

/* ---------- Events ---------- */
$('langTa').addEventListener('click', () => showForm('ta'));
$('langEn').addEventListener('click', () => showForm('en'));
$('switchBtn').addEventListener('click', () => showForm(lang === 'ta' ? 'en' : 'ta')); // உடனே மொழி மாற்றம்
$('locBtn').addEventListener('click', getLocation);

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  msgState = null; renderMsg();
  const name = $('name').value.trim(), address = $('address').value.trim(), phone = $('phone').value.trim();
  if (!name || !address || !phone) return setMsg('err', 'fillAll');
  if (!/^[0-9+\s-]{7,16}$/.test(phone)) return setMsg('err', 'badPhone');
  if (!pos) return setMsg('err', 'needLoc');
  if (API_URL.startsWith('PASTE')) return setMsg('err', 'noApiUrl');

  const btn = $('submitBtn');
  btn.disabled = true; btn.dataset.busy = '1'; btn.textContent = t('sending');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight தவிர்க்க
      body: JSON.stringify({ action: 'add', name, address, phone, lat: pos.lat, lng: pos.lng, accuracy: pos.accuracy })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed');
    $('f').reset(); pos = null;
    locBtnKey = 'locBtnGet';
    setLoc('', 'locNone');
    setMsg('ok', 'saved');
  } catch (err) {
    setMsg('err', 'saveFail', err.message);
  } finally {
    delete btn.dataset.busy;
    btn.textContent = t('submit');
    updateSubmit();
  }
});

// தொடக்கத்தில் மொழித் தேர்வுத் திரை மட்டும் தெரியும்
locState = { cls: '', key: 'locNone', arg: null };
</script>
</body>
</html>
